version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neuroaid-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - FLASK_ENV=production
    command: python -u app.py
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuroaid-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always

volumes:
  uploads:
